# Nginx vhost for resume.thetan.in
#
# Install:
#   ln -sf /var/www/resume/deploy/nginx/resume.thetan.in.conf \
#          /etc/nginx/sites-enabled/resume.thetan.in.conf
#   nginx -t && systemctl reload nginx
#
# Then get TLS (certbot rewrites this file in place, adding the :443 block and
# the http->https redirect — that edit is expected, don't revert it):
#   certbot --nginx -d resume.thetan.in
#
# NOTE: after certbot edits it, this file and the repo copy diverge. See
# deploy/README.md for how to re-sync without losing the SSL block.

server {
    listen 80;
    listen [::]:80;
    server_name resume.thetan.in;

    # ------------------------------------------------------------------
    # React (Vite) production build — plain static files, no PM2 process.
    # Matches how /var/www/frontend is served on this box.
    # ------------------------------------------------------------------
    root /var/www/resume/frontend/dist;
    index index.html;

    access_log /var/log/nginx/resume.access.log;
    error_log  /var/log/nginx/resume.error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm;

    # Vite fingerprints these filenames, so they can never go stale.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # index.html must NOT be cached. If it is, a returning visitor keeps the old
    # HTML pointing at asset hashes that no longer exist after a deploy -> blank page.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ------------------------------------------------------------------
    # FastAPI backend (PM2: resume-backend, 127.0.0.1:8100)
    #
    # The trailing slash on proxy_pass strips the /api prefix. The API's routes
    # live at the root — /auth/*, /profile/*, /resume/*, /demo/*, plus bare
    # /compile, /match, /generate — so:
    #     browser  GET /api/auth/me   ->  uvicorn  GET /auth/me
    #
    # Serving the API same-origin is deliberate: it means CORS never fires at
    # all, which is why frontend/.env.production sets VITE_API_BASE_URL=/api.
    # ------------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8100/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # DELIBERATELY $remote_addr, not $proxy_add_x_forwarded_for.
        #
        # app/api/routes/demo.py:_client_ip() trusts the FIRST hop of
        # X-Forwarded-For. The usual "append" variable would preserve a
        # client-supplied header, letting anyone forge a fresh IP and farm
        # unlimited free gpt-5 demo generations. Overwriting it here makes the
        # first hop always the real TCP peer.
        proxy_set_header X-Forwarded-For   $remote_addr;

        # /generate does a gpt-5 call + pdflatex compile + up to 2 repair
        # retries. Nginx's 60s default read timeout would 504 mid-generation
        # on every slow request — Render's proxy allowed far more.
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # Stream the PDF straight to the client instead of spooling it to disk.
        proxy_buffering off;
        proxy_request_buffering off;

        # Resume PDF upload cap is 5 MB server-side (config.max_pdf_bytes).
        # Nginx's 1 MB default would reject uploads with a 413 before FastAPI
        # ever saw them. 6 MB leaves room for multipart overhead.
        client_max_body_size 6M;
    }

    # ------------------------------------------------------------------
    # SPA fallback — React Router owns every path that isn't a real file.
    # This is the nginx equivalent of frontend/vercel.json's rewrite rule.
    # ------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't leak dotfiles from the build output.
    location ~ /\. {
        deny all;
    }
}
