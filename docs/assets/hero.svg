<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 430" width="1280" height="430" role="img" aria-label="ResumeOS - paste a job description, get a grounded one-page resume">
  <title>ResumeOS - an AI resume tailoring engine that cannot invent facts about you</title>

  <defs>
    <!-- animated wordmark sweep -->
    <linearGradient id="wm" x1="0" y1="0" x2="0.55" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="0.5" stop-color="#34D399"/>
      <stop offset="1" stop-color="#60A5FA"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="-0.55 0; 0.55 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#3B82F6" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </linearGradient>

    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.15" fill="#93A4BC" fill-opacity="0.16"/>
    </pattern>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="58"/>
    </filter>

    <clipPath id="card">
      <rect x="0" y="0" width="1280" height="430" rx="22"/>
    </clipPath>

    <style>
      .f    { font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .m    { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .blob { animation: drift 16s ease-in-out infinite alternate; }
      .blob2{ animation: drift2 19s ease-in-out infinite alternate; }
      @keyframes drift  { from { transform: translate(0,0)   } to { transform: translate(70px,26px)  } }
      @keyframes drift2 { from { transform: translate(0,0)   } to { transform: translate(-60px,-22px)} }

      .live  { animation: blink 2.2s ease-in-out infinite; }
      @keyframes blink { 0%,100% { opacity: 1 } 50% { opacity: .25 } }

      .flow  { stroke-dasharray: 10 260; animation: run 3.4s linear infinite; }
      @keyframes run { to { stroke-dashoffset: -270 } }

      .n1 { animation: lift 6s ease-in-out infinite;         }
      .n2 { animation: lift 6s ease-in-out infinite .55s;    }
      .n3 { animation: lift 6s ease-in-out infinite 1.1s;    }
      .n4 { animation: lift 6s ease-in-out infinite 1.65s;   }
      .n5 { animation: lift 6s ease-in-out infinite 2.2s;    }
      .n6 { animation: lift 6s ease-in-out infinite 2.75s;   }
      @keyframes lift { 0%,72%,100% { opacity: .55 } 12%,50% { opacity: 1 } }

      .type { animation: type 7s steps(46) infinite; }
      @keyframes type { 0% { width: 0 } 42%,100% { width: 486px } }

      .caret { animation: caret .9s step-end infinite; }
      @keyframes caret { 0%,100% { opacity: 1 } 50% { opacity: 0 } }

      @media (prefers-reduced-motion: reduce) {
        .blob,.blob2,.live,.flow,.n1,.n2,.n3,.n4,.n5,.n6,.type,.caret { animation: none }
      }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="430" fill="#05070D"/>
    <rect width="1280" height="430" fill="url(#dots)"/>
    <circle class="blob"  cx="215"  cy="105" r="185" fill="#1D4ED8" fill-opacity="0.30" filter="url(#soft)"/>
    <circle class="blob2" cx="1080" cy="330" r="200" fill="#059669" fill-opacity="0.24" filter="url(#soft)"/>

    <!-- status pill -->
    <g transform="translate(52,44)">
      <rect width="252" height="30" rx="15" fill="#0B1220" stroke="#1F2E45"/>
      <circle class="live" cx="17" cy="15" r="4.5" fill="#34D399"/>
      <text class="m" x="32" y="19.5" font-size="12.5" letter-spacing="1.4" fill="#8FA3BD">LIVE · resume.thetan.in</text>
    </g>

    <!-- wordmark -->
    <text class="f" x="50" y="172" font-size="88" font-weight="800" letter-spacing="-3.4" fill="url(#wm)">ResumeOS</text>

    <text class="f" x="54" y="212" font-size="20.5" fill="#B7C6DA">Paste a job description. Get a one-page, ATS-clean resume tailored to it.</text>

    <!-- typing line -->
    <g transform="translate(54,232)">
      <rect width="700" height="30" rx="6" fill="none"/>
      <!-- width defaults to full so the line stays readable with animations off -->
      <clipPath id="typeclip"><rect class="type" x="0" y="0" width="486" height="30"/></clipPath>
      <g clip-path="url(#typeclip)">
        <text class="m" x="0" y="21" font-size="16" fill="#6EE7B7">and it physically cannot invent a fact about you.</text>
      </g>
      <rect class="caret" x="490" y="6" width="2" height="18" fill="#6EE7B7"/>
    </g>

    <rect x="50" y="288" width="1180" height="1" fill="url(#rule)"/>

    <!-- pipeline -->
    <g transform="translate(0,318)">
      <!-- connectors -->
      <g stroke-linecap="round" fill="none">
        <path d="M208 33 H252"  stroke="#1F2E45" stroke-width="2"/>
        <path d="M412 33 H456"  stroke="#1F2E45" stroke-width="2"/>
        <path d="M616 33 H660"  stroke="#1F2E45" stroke-width="2"/>
        <path d="M820 33 H864"  stroke="#1F2E45" stroke-width="2"/>
        <path d="M1024 33 H1068" stroke="#1F2E45" stroke-width="2"/>
        <path class="flow" d="M48 33 H1228" stroke="#38BDF8" stroke-width="3"/>
      </g>

      <g class="n1"><rect x="48"   y="12" width="160" height="42" rx="10" fill="#0B1220" stroke="#24354F"/>
        <text class="m" x="128" y="38" font-size="13" text-anchor="middle" fill="#C7D6E8">JOB DESC</text></g>
      <g class="n2"><rect x="252"  y="12" width="160" height="42" rx="10" fill="#0B1220" stroke="#24354F"/>
        <text class="m" x="332" y="38" font-size="13" text-anchor="middle" fill="#C7D6E8">MATCH 0-100</text></g>
      <g class="n3"><rect x="456"  y="12" width="160" height="42" rx="10" fill="#0B1220" stroke="#2F6B4F"/>
        <text class="m" x="536" y="38" font-size="13" text-anchor="middle" fill="#6EE7B7">GATE 70%</text></g>
      <g class="n4"><rect x="660"  y="12" width="160" height="42" rx="10" fill="#0B1220" stroke="#24354F"/>
        <text class="m" x="740" y="38" font-size="13" text-anchor="middle" fill="#C7D6E8">gpt-5 LaTeX</text></g>
      <g class="n5"><rect x="864"  y="12" width="160" height="42" rx="10" fill="#0B1220" stroke="#5B4A1E"/>
        <text class="m" x="944" y="38" font-size="13" text-anchor="middle" fill="#FCD34D">GUARDRAILS</text></g>
      <g class="n6"><rect x="1068" y="12" width="160" height="42" rx="10" fill="#0B1220" stroke="#2F6B4F"/>
        <text class="m" x="1148" y="38" font-size="13" text-anchor="middle" fill="#6EE7B7">PDF · 1 page</text></g>
    </g>

    <!-- chips -->
    <g class="f" font-size="12.5" fill="#8FA3BD">
      <g transform="translate(50,392)">
        <rect width="152" height="26" rx="13" fill="#0A1018" stroke="#1C2A3E"/>
        <text x="76" y="17.5" text-anchor="middle">0 fabrications</text>
      </g>
      <g transform="translate(214,392)">
        <rect width="152" height="26" rx="13" fill="#0A1018" stroke="#1C2A3E"/>
        <text x="76" y="17.5" text-anchor="middle">deterministic ATS</text>
      </g>
      <g transform="translate(378,392)">
        <rect width="152" height="26" rx="13" fill="#0A1018" stroke="#1C2A3E"/>
        <text x="76" y="17.5" text-anchor="middle">self-repairing</text>
      </g>
      <g transform="translate(542,392)">
        <rect width="152" height="26" rx="13" fill="#0A1018" stroke="#1C2A3E"/>
        <text x="76" y="17.5" text-anchor="middle">injection-safe</text>
      </g>
      <g transform="translate(706,392)">
        <rect width="180" height="26" rx="13" fill="#0A1018" stroke="#1C2A3E"/>
        <text x="90" y="17.5" text-anchor="middle">FastAPI · React 19</text>
      </g>
      <g transform="translate(898,392)">
        <rect width="160" height="26" rx="13" fill="#0A1018" stroke="#1C2A3E"/>
        <text x="80" y="17.5" text-anchor="middle">pdflatex · Neon</text>
      </g>
    </g>

    <rect x="0.5" y="0.5" width="1279" height="429" rx="22" fill="none" stroke="#1B2942"/>
  </g>
</svg>
