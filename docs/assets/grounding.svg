<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 530" width="1280" height="530" role="img" aria-label="The anti-fabrication guardrail">
  <title>Anti-fabrication - every claim in the resume is traced back to the profile</title>

  <defs>
    <pattern id="gdots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#93A4BC" fill-opacity="0.13"/>
    </pattern>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#38BDF8" stop-opacity="0.55"/>
      <stop offset="1"   stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <marker id="gah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4B6076"/>
    </marker>
    <filter id="gglow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="48"/>
    </filter>
    <clipPath id="gcard"><rect width="1280" height="530" rx="20"/></clipPath>
    <clipPath id="scanbox"><rect x="864" y="96" width="376" height="290"/></clipPath>

    <style>
      .f  { font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .m  { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .lbl{ font-size: 11.5px; letter-spacing: 1.9px; fill: #7E90A9; }
      .s  { font-size: 11.8px; fill: #92A5BE; }

      .scan { animation: scan 6s ease-in-out infinite; }
      @keyframes scan { 0% { transform: translateY(0) } 50% { transform: translateY(272px) } 100% { transform: translateY(0) } }

      .ok1 { animation: ok 6s ease-in-out infinite 0.5s; }
      .ok2 { animation: ok 6s ease-in-out infinite 1.1s; }
      .ok3 { animation: ok 6s ease-in-out infinite 1.7s; }
      @keyframes ok { 0%,6% { opacity: .18 } 14%,100% { opacity: 1 } }

      .bad1 { animation: bad 6s ease-in-out infinite 2.3s; }
      .bad2 { animation: bad 6s ease-in-out infinite 2.9s; }
      @keyframes bad { 0%,6% { opacity: .18 } 14%,100% { opacity: 1 } }

      .strobe { animation: strobe 6s ease-in-out infinite 2.3s; }
      @keyframes strobe { 0%,34% { opacity: 0 } 42%,58% { opacity: .5 } 70%,100% { opacity: .22 } }

      .verdict { animation: verdict 6s ease-in-out infinite; }
      @keyframes verdict { 0%,55% { opacity: .2 } 65%,100% { opacity: 1 } }

      .feed { stroke-dasharray: 8 120; animation: feed 2.6s linear infinite; }
      @keyframes feed { to { stroke-dashoffset: -128 } }

      @media (prefers-reduced-motion: reduce) {
        .scan,.ok1,.ok2,.ok3,.bad1,.bad2,.strobe,.verdict,.feed { animation: none }
      }
    </style>
  </defs>

  <g clip-path="url(#gcard)">
    <rect width="1280" height="530" fill="#05070D"/>
    <rect width="1280" height="530" fill="url(#gdots)"/>
    <circle cx="1150" cy="430" r="170" fill="#B91C1C" fill-opacity="0.14" filter="url(#gglow)"/>
    <circle cx="180" cy="120" r="170" fill="#1D4ED8" fill-opacity="0.18" filter="url(#gglow)"/>

    <text class="m lbl" x="40" y="38">ZERO FABRICATION — ENFORCED IN CODE, NOT TRUSTED TO THE MODEL</text>
    <text class="m" x="1240" y="38" font-size="11.5" text-anchor="end" fill="#4E6076">guardrails.check_facts()</text>

    <!-- ============ profile ============ -->
    <rect x="40" y="64" width="376" height="322" rx="13" fill="#080D16" stroke="#243A57"/>
    <text class="m lbl" x="58" y="90">PROFILE · THE CLOSED FACT SET</text>
    <text class="f s" x="58" y="112">The whole JSON is handed to the judge — not an extract.</text>

    <g class="m" font-size="11.5" fill="#BFD2E6">
      <g><rect x="58" y="128" width="86"  height="26" rx="13" fill="#0C1421" stroke="#2A3E5C"/><text x="101" y="145.5" text-anchor="middle">Python</text></g>
      <g><rect x="152" y="128" width="90"  height="26" rx="13" fill="#0C1421" stroke="#2A3E5C"/><text x="197" y="145.5" text-anchor="middle">FastAPI</text></g>
      <g><rect x="250" y="128" width="108" height="26" rx="13" fill="#0C1421" stroke="#2A3E5C"/><text x="304" y="145.5" text-anchor="middle">LangGraph</text></g>
      <g><rect x="58"  y="162" width="66"  height="26" rx="13" fill="#0C1421" stroke="#2A3E5C"/><text x="91"  y="179.5" text-anchor="middle">RAG</text></g>
      <g><rect x="132" y="162" width="92"  height="26" rx="13" fill="#0C1421" stroke="#2A3E5C"/><text x="178" y="179.5" text-anchor="middle">pgvector</text></g>
      <g><rect x="232" y="162" width="112" height="26" rx="13" fill="#0C1421" stroke="#2A3E5C"/><text x="288" y="179.5" text-anchor="middle">PostgreSQL</text></g>
      <g><rect x="58"  y="196" width="70"  height="26" rx="13" fill="#0C1421" stroke="#2A3E5C"/><text x="93"  y="213.5" text-anchor="middle">AWS</text></g>
      <g><rect x="136" y="196" width="66"  height="26" rx="13" fill="#0C1421" stroke="#2A3E5C"/><text x="169" y="213.5" text-anchor="middle">SSE</text></g>
      <g><rect x="210" y="196" width="78"  height="26" rx="13" fill="#0C1421" stroke="#2A3E5C"/><text x="249" y="213.5" text-anchor="middle">React</text></g>
      <g><rect x="296" y="196" width="72"  height="26" rx="13" fill="#0C1421" stroke="#2A3E5C"/><text x="332" y="213.5" text-anchor="middle">Mem0</text></g>
    </g>

    <rect x="58" y="240" width="340" height="1" fill="#1B2942"/>
    <text class="f s" x="58" y="264">Every value counts as a fact: employers, titles,</text>
    <text class="f s" x="58" y="282">dates, locations, degrees, CGPA, project tech —</text>
    <text class="f s" x="58" y="300">and every single highlight sentence.</text>
    <text class="m" x="58" y="332" font-size="11.5" fill="#F87171">The bug that taught this:</text>
    <text class="f s" x="58" y="352">passing a lossy extract made the judge flag REAL</text>
    <text class="f s" x="58" y="370">facts — the user's own resume failed 16 of 16.</text>

    <!-- ============ judge ============ -->
    <path d="M416 200 H452" stroke="#233246" stroke-width="2" marker-end="url(#gah)"/>
    <path class="feed" d="M416 200 H452" stroke="#38BDF8" stroke-width="2.5"/>
    <path d="M864 200 H828" stroke="#233246" stroke-width="2" marker-end="url(#gah)"/>
    <path class="feed" d="M864 200 H828" stroke="#38BDF8" stroke-width="2.5"/>

    <rect x="452" y="64" width="376" height="322" rx="13" fill="#080D16" stroke="#3B5C8A"/>
    <text class="m lbl" x="470" y="90">THE JUDGE</text>
    <text class="f" x="470" y="118" font-size="15" font-weight="700" fill="#E4EDF9">A grounded fact-checker</text>
    <text class="m" x="470" y="142" font-size="12" fill="#7DD3FC">gpt-4.1-mini · temperature 0 · strict JSON</text>

    <rect x="470" y="160" width="340" height="1" fill="#1B2942"/>

    <text class="f s" x="470" y="186">Paraphrase, reordering, emphasis</text>
    <text class="m" x="470" y="206" font-size="12" fill="#34D399">ALLOWED</text>
    <text class="f s" x="470" y="232">Repositioning a backend engineer with real</text>
    <text class="f s" x="470" y="250">LLM work as a "GenAI Engineer"</text>
    <text class="m" x="470" y="270" font-size="12" fill="#34D399">ALLOWED — framing, not a new fact</text>
    <text class="f s" x="470" y="296">A skill, employer, date or number that</text>
    <text class="f s" x="470" y="314">appears nowhere in the profile</text>
    <text class="m" x="470" y="334" font-size="12" fill="#F87171">VIOLATION — and it must quote it exactly</text>

    <text class="f s" x="470" y="366" fill="#6C7F97">Why not string-matching? You would first have to</text>
    <text class="f s" x="470" y="382" fill="#6C7F97">parse claims out of arbitrary LaTeX. Fragile.</text>

    <!-- ============ generated claims ============ -->
    <rect x="864" y="64" width="376" height="322" rx="13" fill="#080D16" stroke="#243A57"/>
    <text class="m lbl" x="882" y="90">CLAIMS IN THE GENERATED RESUME</text>

    <g clip-path="url(#scanbox)">
      <rect class="scan" x="864" y="100" width="376" height="14" fill="url(#beam)"/>
    </g>

    <g class="ok1">
      <rect x="882" y="106" width="340" height="42" rx="9" fill="#08150F" stroke="#2F6B4F"/>
      <text class="m" x="900" y="124" font-size="11.5" fill="#6EE7B7">OK</text>
      <text class="f" x="936" y="124" font-size="12.5" fill="#D5E4F4">Built RAG pipelines on pgvector</text>
      <text class="f s" x="936" y="140" fill="#6C7F97">traced to projects[].tech</text>
    </g>
    <g class="ok2">
      <rect x="882" y="158" width="340" height="42" rx="9" fill="#08150F" stroke="#2F6B4F"/>
      <text class="m" x="900" y="176" font-size="11.5" fill="#6EE7B7">OK</text>
      <text class="f" x="936" y="176" font-size="12.5" fill="#D5E4F4">Cut API response time ~35%</text>
      <text class="f s" x="936" y="192" fill="#6C7F97">traced to a real highlight</text>
    </g>
    <g class="ok3">
      <rect x="882" y="210" width="340" height="42" rx="9" fill="#08150F" stroke="#2F6B4F"/>
      <text class="m" x="900" y="228" font-size="11.5" fill="#6EE7B7">OK</text>
      <text class="f" x="936" y="228" font-size="12.5" fill="#D5E4F4">"GenAI / LLM Engineer"</text>
      <text class="f s" x="936" y="244" fill="#6C7F97">repositioning, supported by the work</text>
    </g>
    <g class="bad1">
      <rect x="882" y="262" width="340" height="42" rx="9" fill="#150A0A" stroke="#7F2D2D"/>
      <rect class="strobe" x="882" y="262" width="340" height="42" rx="9" fill="#EF4444"/>
      <text class="m" x="900" y="280" font-size="11.5" fill="#FCA5A5">NO</text>
      <text class="f" x="936" y="280" font-size="12.5" font-weight="700" fill="#FECACA">Kotlin</text>
      <text class="f s" x="936" y="296" fill="#B98080">appears nowhere in the profile</text>
    </g>
    <g class="bad2">
      <rect x="882" y="314" width="340" height="42" rx="9" fill="#150A0A" stroke="#7F2D2D"/>
      <text class="m" x="900" y="332" font-size="11.5" fill="#FCA5A5">NO</text>
      <text class="f" x="936" y="332" font-size="12.5" font-weight="700" fill="#FECACA">12 years of experience</text>
      <text class="f s" x="936" y="348" fill="#B98080">invented number</text>
    </g>

    <!-- ============ verdict ============ -->
    <g class="verdict">
      <rect x="40" y="410" width="1200" height="82" rx="13" fill="#0A1019" stroke="#5C2626"/>
      <text class="m" x="62" y="440" font-size="12.5" fill="#F87171">2 violations</text>
      <text class="f" x="176" y="440" font-size="13.5" fill="#D5E4F4">the exact quoted claims are fed straight back into an edit-mode call: remove or correct them, then re-sanitize, recompile, re-judge.</text>
      <text class="f s" x="62" y="468">Retries are capped. If a fabrication still survives the budget, generation REFUSES rather than shipping — a fake fact is worse than no output.</text>
    </g>

    <rect x="0.5" y="0.5" width="1279" height="529" rx="20" fill="none" stroke="#1B2942"/>
  </g>
</svg>
