<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" width="1280" height="900" role="img" aria-label="ResumeOS system architecture">
  <title>ResumeOS system architecture - browser, Nginx, FastAPI services, OpenAI, pdflatex, Neon</title>

  <defs>
    <pattern id="adots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#93A4BC" fill-opacity="0.13"/>
    </pattern>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#38BDF8"/>
    </marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#34D399"/>
    </marker>
    <filter id="aglow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="52"/>
    </filter>
    <clipPath id="acard"><rect width="1280" height="900" rx="20"/></clipPath>

    <style>
      .f  { font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .m  { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .lbl{ font-size: 11.5px; letter-spacing: 1.9px; fill: #7E90A9; }
      .h  { font-size: 14px; font-weight: 700; fill: #E4EDF9; }
      .s  { font-size: 11.8px; fill: #92A5BE; }
      .k  { font-size: 11.5px; fill: #7DD3FC; }

      .down { stroke-dasharray: 12 190; animation: godown 2.9s linear infinite; }
      @keyframes godown { to { stroke-dashoffset: -202 } }

      .up   { stroke-dasharray: 12 240; animation: goup 3.6s linear infinite; }
      @keyframes goup { to { stroke-dashoffset: 252 } }

      .side { stroke-dasharray: 10 120; animation: goside 2.2s linear infinite; }
      @keyframes goside { to { stroke-dashoffset: -130 } }

      .p1 { animation: pulse 7s ease-in-out infinite;       }
      .p2 { animation: pulse 7s ease-in-out infinite 1.2s;  }
      .p3 { animation: pulse 7s ease-in-out infinite 2.4s;  }
      .p4 { animation: pulse 7s ease-in-out infinite 3.6s;  }
      .p5 { animation: pulse 7s ease-in-out infinite 4.8s;  }
      @keyframes pulse { 0%,80%,100% { stroke: #24354F } 8%,26% { stroke: #3B82F6 } }

      @media (prefers-reduced-motion: reduce) {
        .down,.up,.side,.p1,.p2,.p3,.p4,.p5 { animation: none }
      }
    </style>
  </defs>

  <g clip-path="url(#acard)">
    <rect width="1280" height="900" fill="#05070D"/>
    <rect width="1280" height="900" fill="url(#adots)"/>
    <circle cx="140" cy="120" r="190" fill="#1D4ED8" fill-opacity="0.20" filter="url(#aglow)"/>
    <circle cx="1160" cy="820" r="190" fill="#059669" fill-opacity="0.18" filter="url(#aglow)"/>

    <text class="m lbl" x="40" y="38">SYSTEM ARCHITECTURE</text>
    <text class="m" x="1240" y="38" font-size="11.5" text-anchor="end" fill="#4E6076">resume.thetan.in</text>

    <!-- ============ BROWSER ============ -->
    <rect x="40" y="58" width="1160" height="132" rx="14" fill="#080D16" stroke="#1B2942"/>
    <text class="m lbl" x="60" y="84">BROWSER</text>
    <text class="f s" x="1180" y="84" text-anchor="end">React 19 · Vite 8 · Tailwind v4 · Motion</text>

    <g>
      <rect x="60"  y="98" width="265" height="74" rx="10" fill="#0C1421" stroke="#213149"/>
      <text class="f h" x="76" y="122">Landing + live demo</text>
      <text class="f s" x="76" y="142">Real generator, no signup</text>
      <text class="m k" x="76" y="160">1 free run / IP</text>

      <rect x="345" y="98" width="265" height="74" rx="10" fill="#0C1421" stroke="#213149"/>
      <text class="f h" x="361" y="122">Dashboard</text>
      <text class="f s" x="361" y="142">JD → score → PDF → chat-edit</text>
      <text class="m k" x="361" y="160">the main flow</text>

      <rect x="630" y="98" width="265" height="74" rx="10" fill="#0C1421" stroke="#213149"/>
      <text class="f h" x="646" y="122">Profile</text>
      <text class="f s" x="646" y="142">Seed from PDF or LaTeX</text>
      <text class="m k" x="646" y="160">the fact set</text>

      <rect x="915" y="98" width="265" height="74" rx="10" fill="#0C1421" stroke="#213149"/>
      <text class="f h" x="931" y="122">Advanced editor</text>
      <text class="f s" x="931" y="142">Raw LaTeX escape hatch</text>
      <text class="m k" x="931" y="160">where it all began</text>
    </g>

    <!-- browser -> nginx -->
    <path d="M620 190 V228" stroke="#1F2E45" stroke-width="2"/>
    <path class="down" d="M620 190 V228" stroke="#38BDF8" stroke-width="3" marker-end="url(#ah)"/>
    <text class="m" x="636" y="214" font-size="11" fill="#5C7189">HTTPS</text>

    <!-- ============ NGINX ============ -->
    <rect x="40" y="230" width="1160" height="66" rx="14" fill="#0A1019" stroke="#243A57"/>
    <text class="m lbl" x="60" y="256">EDGE</text>
    <text class="f h" x="60" y="278">Nginx · TLS · one box, four sites</text>
    <g class="m" font-size="11.5" fill="#8FA3BD">
      <text x="470" y="258">/  →  frontend/dist   (static)</text>
      <text x="470" y="278">/api/  →  127.0.0.1:8100   (trailing slash strips the prefix — CORS never fires)</text>
    </g>
    <g class="m" font-size="11" fill="#FCD34D">
      <text x="1180" y="258" text-anchor="end">proxy_read_timeout 300s</text>
      <text x="1180" y="278" text-anchor="end">client_max_body_size 6M</text>
    </g>

    <path d="M620 296 V336" stroke="#1F2E45" stroke-width="2"/>
    <path class="down" d="M620 296 V336" stroke="#38BDF8" stroke-width="3" marker-end="url(#ah)"/>

    <!-- ============ FASTAPI ============ -->
    <rect x="40" y="338" width="1160" height="374" rx="14" fill="#080D16" stroke="#1B2942"/>
    <text class="m lbl" x="60" y="364">FASTAPI · fully async · PM2 + uvicorn on 127.0.0.1:8100</text>

    <!-- routes -->
    <text class="m" x="60" y="390" font-size="11" fill="#5C7189">thin routers — zero business logic</text>
    <g class="m" font-size="11.5" fill="#C7D6E8">
      <g><rect class="p1" x="60"     y="398" width="149.5" height="34" rx="8" fill="#0C1421" stroke="#24354F"/>
        <text x="134.7" y="420" text-anchor="middle">/auth/*</text></g>
      <g><rect class="p2" x="221.5"  y="398" width="149.5" height="34" rx="8" fill="#0C1421" stroke="#24354F"/>
        <text x="296.2" y="420" text-anchor="middle">/profile/*</text></g>
      <g><rect class="p3" x="383"    y="398" width="149.5" height="34" rx="8" fill="#0C1421" stroke="#24354F"/>
        <text x="457.7" y="420" text-anchor="middle">/match</text></g>
      <g><rect class="p4" x="544.5"  y="398" width="149.5" height="34" rx="8" fill="#0C1421" stroke="#24354F"/>
        <text x="619.2" y="420" text-anchor="middle">/generate</text></g>
      <g><rect class="p5" x="706"    y="398" width="149.5" height="34" rx="8" fill="#0C1421" stroke="#24354F"/>
        <text x="780.7" y="420" text-anchor="middle">/resume/edit</text></g>
      <g><rect class="p1" x="867.5"  y="398" width="149.5" height="34" rx="8" fill="#0C1421" stroke="#24354F"/>
        <text x="942.2" y="420" text-anchor="middle">/demo/*</text></g>
      <g><rect class="p3" x="1029"   y="398" width="149.5" height="34" rx="8" fill="#0C1421" stroke="#24354F"/>
        <text x="1103.7" y="420" text-anchor="middle">/compile</text></g>
    </g>

    <path d="M620 432 V450" stroke="#1F2E45" stroke-width="2"/>

    <!-- services -->
    <text class="m" x="60" y="470" font-size="11" fill="#5C7189">services — HTTP-agnostic, testable, where the work lives</text>
    <g>
      <rect x="60"  y="480" width="211" height="126" rx="10" fill="#0C1421" stroke="#2A3E5C"/>
      <text class="m" x="76" y="502" font-size="11.5" fill="#7DD3FC">match_service</text>
      <text class="f s" x="76" y="524">Fixed rubric, temp 0</text>
      <text class="f s" x="76" y="542">JD framed as DATA</text>
      <text class="f s" x="76" y="560">Size router picks tier</text>
      <text class="m" x="76" y="586" font-size="11" fill="#34D399">→ score · missing · fixes</text>

      <rect x="287" y="480" width="211" height="126" rx="10" fill="#0C1421" stroke="#3B5C8A"/>
      <text class="m" x="303" y="502" font-size="11.5" fill="#7DD3FC">generation_service</text>
      <text class="f s" x="303" y="524">Writes the whole .tex</text>
      <text class="f s" x="303" y="542">Verify &amp; repair loop</text>
      <text class="f s" x="303" y="560">Budget: 6 model calls</text>
      <text class="m" x="303" y="586" font-size="11" fill="#34D399">→ the heart of the app</text>

      <rect x="514" y="480" width="211" height="126" rx="10" fill="#0C1421" stroke="#5B4A1E"/>
      <text class="m" x="530" y="502" font-size="11.5" fill="#FCD34D">guardrails</text>
      <text class="f s" x="530" y="524">ats_sanitize() — code</text>
      <text class="f s" x="530" y="542">count_pages() — pypdf</text>
      <text class="f s" x="530" y="560">check_facts() — judge</text>
      <text class="m" x="530" y="586" font-size="11" fill="#FCD34D">→ the three guarantees</text>

      <rect x="741" y="480" width="211" height="126" rx="10" fill="#0C1421" stroke="#2A3E5C"/>
      <text class="m" x="757" y="502" font-size="11.5" fill="#7DD3FC">resume_edit_service</text>
      <text class="f s" x="757" y="524">Splits by \section{}</text>
      <text class="f s" x="757" y="542">Sends ONE block</text>
      <text class="f s" x="757" y="560">Returns edit list</text>
      <text class="m" x="757" y="586" font-size="11" fill="#34D399">→ fast chat edits</text>

      <rect x="968" y="480" width="211" height="126" rx="10" fill="#0C1421" stroke="#2A3E5C"/>
      <text class="m" x="984" y="502" font-size="11.5" fill="#7DD3FC">latex_service</text>
      <text class="f s" x="984" y="524">temp dir per compile</text>
      <text class="f s" x="984" y="542">20s timeout</text>
      <text class="f s" x="984" y="560">error snippet on fail</text>
      <text class="m" x="984" y="586" font-size="11" fill="#34D399">→ .tex to PDF bytes</text>
    </g>

    <!-- utils row -->
    <g>
      <rect x="60"  y="626" width="236" height="66" rx="10" fill="#0A1019" stroke="#1F2E45"/>
      <text class="m" x="76" y="650" font-size="11.5" fill="#A9BCD4">utils/edits.py</text>
      <text class="f s" x="76" y="672">Applies only on a UNIQUE anchor</text>

      <rect x="312" y="626" width="236" height="66" rx="10" fill="#0A1019" stroke="#1F2E45"/>
      <text class="m" x="328" y="650" font-size="11.5" fill="#A9BCD4">utils/analytics.py</text>
      <text class="f s" x="328" y="672">1 log line per request, contextvar</text>

      <rect x="564" y="626" width="236" height="66" rx="10" fill="#0A1019" stroke="#1F2E45"/>
      <text class="m" x="580" y="650" font-size="11.5" fill="#A9BCD4">db/database.py</text>
      <text class="f s" x="580" y="672">asyncpg pool · idempotent schema</text>

      <rect x="816" y="626" width="364" height="66" rx="10" fill="#0A1019" stroke="#3B5C8A"/>
      <text class="m" x="832" y="650" font-size="11.5" fill="#7DD3FC">ai_client.py — the only file that imports openai</text>
      <text class="f s" x="832" y="672">retries · backoff · fallback model · per-call token log</text>
    </g>

    <!-- fastapi -> externals -->
    <path d="M240 712 V756"  stroke="#1F2E45" stroke-width="2"/>
    <path class="down" d="M240 712 V756" stroke="#38BDF8" stroke-width="3" marker-end="url(#ah)"/>
    <path d="M620 712 V756"  stroke="#1F2E45" stroke-width="2"/>
    <path class="down" d="M620 712 V756" stroke="#38BDF8" stroke-width="3" marker-end="url(#ah)"/>
    <path d="M1000 712 V756" stroke="#1F2E45" stroke-width="2"/>
    <path class="down" d="M1000 712 V756" stroke="#38BDF8" stroke-width="3" marker-end="url(#ah)"/>

    <!-- ============ EXTERNALS ============ -->
    <g>
      <rect x="60"  y="758" width="360" height="104" rx="12" fill="#0A1019" stroke="#243A57"/>
      <text class="m lbl" x="78" y="782">MODELS · OpenAI</text>
      <text class="m" x="78" y="806" font-size="12" fill="#E4EDF9">gpt-5</text>
      <text class="f s" x="140" y="806">generation + self-repair (rare)</text>
      <text class="m" x="78" y="828" font-size="12" fill="#E4EDF9">gpt-4.1 / mini</text>
      <text class="f s" x="188" y="828">match · judge · edits (often)</text>
      <text class="m" x="78" y="850" font-size="11" fill="#5C7189">fallback: gpt-4o-mini</text>

      <rect x="440" y="758" width="360" height="104" rx="12" fill="#0A1019" stroke="#243A57"/>
      <text class="m lbl" x="458" y="782">COMPILER</text>
      <text class="m" x="458" y="806" font-size="12" fill="#E4EDF9">pdflatex · TeX Live</text>
      <text class="f s" x="458" y="828">3 collections, ~1 GB — same set in dev and prod</text>
      <text class="f s" x="458" y="850">fontawesome5 · marvosym · titlesec · enumitem</text>

      <rect x="820" y="758" width="360" height="104" rx="12" fill="#0A1019" stroke="#243A57"/>
      <text class="m lbl" x="838" y="782">DATA · Neon Postgres</text>
      <text class="f s" x="838" y="806">users · profiles (jsonb) · resumes</text>
      <text class="f s" x="838" y="828">demo_usage · demo_rate · chat_usage</text>
      <text class="m" x="838" y="850" font-size="11" fill="#5C7189">no LaTeX, no PDFs stored — ever</text>
    </g>

    <!-- return lane: the PDF comes back -->
    <path d="M1200 810 H1232 V150 H1200" fill="none" stroke="#14301F" stroke-width="2"/>
    <path class="up" d="M1200 810 H1232 V150 H1200" fill="none" stroke="#34D399" stroke-width="3" marker-end="url(#ahg)"/>
    <text class="m" x="1252" y="500" font-size="11.5" fill="#34D399" transform="rotate(90,1252,500)" text-anchor="middle">one-page PDF back to the browser</text>

    <rect x="0.5" y="0.5" width="1279" height="899" rx="20" fill="none" stroke="#1B2942"/>
  </g>
</svg>
